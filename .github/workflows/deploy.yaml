---
name: Deploy

# Trust boundary: every trigger here is an event a fork cannot cause. A push to
# main requires write access; publishing a release requires the same. There is
# deliberately no `workflow_run` trigger: that runs with the base repository's
# elevated token after a workflow a fork PR started, and guarding it correctly
# is a standing obligation this workflow avoids by not taking it on.
#
# Ordering with CI is a `needs:` edge rather than a completion event, so the
# publish job cannot run against code CI has not passed.
#
# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/upstream-ci.yaml
    permissions:
      contents: read

  publish:
    name: Publish image
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The only job in the repository that holds a write capability, and it holds
    # exactly one.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # This job restores no cache. Build caches are writable by workflows that
      # run untrusted pull request code, so a job that produces a published
      # artifact treats them as an untrusted input and rebuilds from source.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The release tag is attacker-influenced only by someone who already has
      # write access, but it still crosses into the shell as data rather than as
      # an interpolated splice.
      - name: Resolve tags
        id: tags
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$EVENT" = "release" ]; then
            printf 'tags=%s:%s,%s:latest\n' "$image" "${TAG#v}" "$image" >> "$GITHUB_OUTPUT"
          else
            printf 'tags=%s:edge\n' "$image" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: mode=max
          sbom: true
