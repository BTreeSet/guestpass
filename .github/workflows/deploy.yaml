---
name: Deploy

# Trust boundary: every trigger here is an event a fork cannot cause. A push to
# main requires write access; publishing a release requires the same. There is
# deliberately no `workflow_run` trigger: that runs with the base repository's
# elevated token after a workflow a fork PR started, and guarding it correctly
# is a standing obligation this workflow avoids by not taking it on.
#
# Ordering with CI is a `needs:` edge rather than a completion event, so the
# publish job cannot run against code CI has not passed.
#
# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/upstream-ci.yaml
    permissions:
      contents: read

  meta:
    name: Resolve release identity
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      tags: ${{ steps.resolve.outputs.tags }}
      version: ${{ steps.resolve.outputs.version }}
      created: ${{ steps.resolve.outputs.created }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The Supervisor installs `<image>:<version>`, and both come from
      # addon/config.yaml. A release whose tag disagrees with that version
      # publishes an add-on nobody can install, so the two are reconciled here
      # and the job stops rather than shipping the mismatch.
      #
      # The release tag is attacker-influenced only by someone who already holds
      # write access, and it still crosses into the shell as data rather than as
      # an interpolated splice.
      - name: Resolve
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          declared=$(sed -n 's/^image: *//p' addon/config.yaml | tr -d '"')
          if [ "$declared" != "$image" ]; then
            echo "::error ::addon/config.yaml names $declared; this workflow publishes $image"
            exit 1
          fi

          declared_version=$(sed -n 's/^version: *//p' addon/config.yaml | tr -d '"')
          if [ "$EVENT" = "release" ]; then
            version="${TAG#v}"
            if [ "$version" != "$declared_version" ]; then
              echo "::error ::release $TAG is $version; the manifest says $declared_version"
              exit 1
            fi
            tags="$version latest"
          else
            version="${GITHUB_SHA:0:7}"
            tags="edge"
          fi

          {
            printf 'image=%s\n' "$image"
            printf 'tags=%s\n' "$tags"
            printf 'version=%s\n' "$version"
            printf 'created=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

  # One runner per architecture, each compiling for the machine it runs on.
  # Emulating aarch64 on an amd64 runner costs an order of magnitude on a Rust
  # release build, and the emulator is a build dependency with nothing to show
  # for itself once native runners exist.
  #
  # The matrix is a literal rather than a value read from addon/config.yaml,
  # because a runner label is a fact about GitHub that the add-on manifest has
  # no business naming. `ci/gates.sh` asserts the two architecture sets agree.
  build:
    name: Build ${{ matrix.arch }}
    needs: [meta]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # This job restores no cache. Build caches are writable by workflows that
      # run untrusted pull request code, so a job that produces a published
      # artifact treats them as an untrusted input and rebuilds from source.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest and left untagged. A per-architecture tag would be
      # pullable, and an add-on that pulled one would run the wrong machine
      # code; only the manifest list the next job creates carries a name.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          # yamllint disable-line rule:line-length
          outputs: type=image,name=${{ needs.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_DATE=${{ needs.meta.outputs.created }}
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ needs.meta.outputs.version }}

      # The digest is the whole payload: an empty file named after it carries
      # one architecture's result to the manifest job.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The join. `image: ghcr.io/btreeset/guestpass` in addon/config.yaml resolves
  # here, and the Supervisor picks the architecture out of the list.
  manifest:
    name: Publish manifest list
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          read -ra tag_list <<< "$TAGS"
          args=()
          for tag in "${tag_list[@]}"; do
            args+=(--tag "$IMAGE:$tag")
          done
          for digest in /tmp/digests/*; do
            args+=("$IMAGE@sha256:$(basename "$digest")")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          read -ra tag_list <<< "$TAGS"
          docker buildx imagetools inspect "$IMAGE:${tag_list[0]}"
