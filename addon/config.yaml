---
name: guestpass
version: 0.1.0
slug: guestpass
description: >-
  Give a visitor a QR code that turns on one light, from anywhere, without
  exposing Home Assistant.
url: "https://github.com/BTreeSet/guestpass"
startup: services
# Docker's tini reaps orphaned children. It is a waitpid loop, not a service
# manager: cloudflared is supervised in-process (AGENTS.md C-12).
init: true
# The narrowest grant that reaches the six endpoints. Not hassio_api: guestpass
# has no business talking to the Supervisor.
homeassistant_api: true
arch:
  - aarch64
  - amd64
# One multi-arch manifest, which the Supervisor resolves to this machine's
# architecture. `.github/workflows/deploy.yaml` publishes it under this exact
# name, tagged with the `version` above.
image: ghcr.io/btreeset/guestpass
map:
  - addon_config:rw
# No ports, and no network listener at all: the guest surface is a UNIX socket
# that only cloudflared, in this container, can reach.
ports: {}
# No ingress: there is no management surface to serve.
ingress: false
# guestpass reads these from /data/options.json at startup.
options:
  policy_file: /config/guestpass.yaml
  log_level: info
  emit_tex: false
schema:
  policy_file: str
  log_level: list(trace|debug|info|warning|error)?
  emit_tex: bool?
